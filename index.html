<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>萬達員工打卡系統</title>


  <style>

    /* =====================================================
       整體頁面
       ===================================================== */

    body {

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      margin: 0;

      padding: 20px;

      box-sizing: border-box;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

      background-color: #ffffff;

      color: #222222;

    }


    /* =====================================================
       主要內容
       ===================================================== */

    .container {

      width: 100%;

      max-width: 450px;

      text-align: center;

      background-color: #ffffff;

    }


    /* =====================================================
       標題
       ===================================================== */

    h1 {

      margin: 0 0 25px 0;

      color: #222222;

      font-size: 28px;

    }


    /* =====================================================
       姓名輸入框
       ===================================================== */

    input {

      display: block;

      width: 50%;

      padding: 7px;

      margin: 10px auto;

      box-sizing: border-box;

      border: 1px solid #cccccc;

      border-radius: 5px;

      background-color: #ffffff;

      color: #222222;

      font-size: 15px;

      text-align: center;

    }


    input:focus {

      outline: none;

      border-color: #007bff;

    }


    /* =====================================================
       日期
       ===================================================== */

    #date {

      margin: 15px 0;

      color: #333333;

      font-size: 16px;

    }


    /* =====================================================
       打卡按鈕
       ===================================================== */

    .buttons {

      margin-top: 20px;

      height: 52px;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .buttons button {

      margin: 5px;

      padding: 11px 22px;

      border: none;

      border-radius: 5px;

      background-color: #007bff;

      color: #ffffff;

      cursor: pointer;

      font-size: 16px;

    }


    .buttons button:hover {

      background-color: #0056b3;

    }


    .buttons button:active {

      background-color: #004494;

    }


    .buttons button:disabled {

      background-color: #999999;

      color: #ffffff;

      cursor: not-allowed;

    }


    /* =====================================================
       打卡資訊固定區域
       ===================================================== */

    .result-area {

      width: 100%;

      margin-top: 15px;

      box-sizing: border-box;

      text-align: center;

    }


    /* =====================================================
       定位狀態
       ===================================================== */

    #locationStatus {

      width: 100%;

      min-height: 85px;

      margin: 0;

      padding: 5px 0;

      box-sizing: border-box;

      background-color: #ffffff;

      line-height: 1.7;

      word-break: break-word;

      text-align: center;

    }


    /* =====================================================
       成功
       ===================================================== */

    .success {

      color: #008000 !important;

    }


    /* =====================================================
       錯誤
       ===================================================== */

    .error {

      color: #d00000 !important;

    }


    /* =====================================================
       警告
       ===================================================== */

    .warning {

      color: #d97706 !important;

    }


    /* =====================================================
       定位中
       ===================================================== */

    .loading {

      color: #555555 !important;

    }


    /* =====================================================
       打卡結果
       ===================================================== */

    #clockResult {

      width: 100%;

      margin: 0;

      padding: 5px 0;

      box-sizing: border-box;

      background-color: #ffffff;

      color: #222222;

      line-height: 1.8;

      text-align: center;

      visibility: hidden;

    }


    /* =====================================================
       打卡成功標題
       ===================================================== */

    #clockResult .result-title {

      color: #008000;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 5px;

    }


  </style>

</head>


<body>


  <div class="container">


    <!-- ===================================================
         標題
         =================================================== -->

    <h1>
      萬達員工打卡系統
    </h1>


    <!-- ===================================================
         員工姓名
         =================================================== -->

    <input
      type="text"
      id="employeeName"
      placeholder="請輸入姓名"
      autocomplete="name"
      maxlength="6"
    >


    <!-- ===================================================
         日期
         =================================================== -->

    <p id="date"></p>


    <!-- ===================================================
         打卡按鈕
         =================================================== -->

    <div class="buttons">

      <button
        id="clockIn"
      >
        上班打卡
      </button>


      <button
        id="clockOut"
      >
        下班打卡
      </button>

    </div>


    <!-- ===================================================
         固定資訊區域
         =================================================== -->

    <div class="result-area">


      <!-- ===============================================
           定位狀態
           =============================================== -->

      <div id="locationStatus">

        按下打卡按鈕後確認位置

      </div>


      <!-- ===============================================
           打卡結果
           =============================================== -->

      <div id="clockResult">

      </div>


    </div>


  </div>


  <script>


    // =====================================================
    // Google Apps Script 網址
    // =====================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzlld1b7AOtky-DegF9HYa9cdbMTimLHqNgcNIxaqPz3sOdxCXK6DbnnL9QG7C9OEI/exec";


    // =====================================================
    // 公司位置
    // =====================================================

    const COMPANY_LATITUDE =
      22.721785308817168;


    const COMPANY_LONGITUDE =
      120.30031616249235;


    // =====================================================
    // 公司允許打卡範圍
    // 單位：公尺
    // =====================================================

    const ALLOWED_RADIUS =
      70;


    // =====================================================
    // GPS 最大允許誤差
    // 單位：公尺
    // =====================================================

    const MAX_GPS_ACCURACY =
      70;


    // =====================================================
    // DOM 元素
    // =====================================================

    const employeeName =
      document.getElementById(
        "employeeName"
      );


    const dateElement =
      document.getElementById(
        "date"
      );


    const locationStatus =
      document.getElementById(
        "locationStatus"
      );


    const clockInButton =
      document.getElementById(
        "clockIn"
      );


    const clockOutButton =
      document.getElementById(
        "clockOut"
      );


    const clockResult =
      document.getElementById(
        "clockResult"
      );


    // =====================================================
    // 顯示日期
    // =====================================================

    function updateDate() {

      const now =
        new Date();


      dateElement.textContent =
        "日期：" +
        now.toLocaleDateString(
          "zh-TW"
        );

    }


    // =====================================================
    // 網頁載入時顯示日期
    // =====================================================

    updateDate();


    setInterval(
      updateDate,
      60000
    );


    // =====================================================
    // Haversine Formula
    //
    // 計算 GPS 與公司位置的距離
    // =====================================================

    function calculateDistance(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const earthRadius =
        6371000;


      const lat1Rad =
        lat1 *
        Math.PI /
        180;


      const lat2Rad =
        lat2 *
        Math.PI /
        180;


      const deltaLat =
        (lat2 - lat1) *
        Math.PI /
        180;


      const deltaLon =
        (lon2 - lon1) *
        Math.PI /
        180;


      const a =

        Math.sin(
          deltaLat / 2
        ) ** 2 +

        Math.cos(lat1Rad) *

        Math.cos(lat2Rad) *

        Math.sin(
          deltaLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return (
        earthRadius *
        c
      );

    }


    // =====================================================
    // 設定按鈕是否可以使用
    // =====================================================

    function setButtonsEnabled(
      enabled
    ) {

      clockInButton.disabled =
        !enabled;


      clockOutButton.disabled =
        !enabled;

    }


    // =====================================================
    // GPS 錯誤訊息
    // =====================================================

    function getLocationErrorMessage(
      error
    ) {

      switch (
        error.code
      ) {

        case error.PERMISSION_DENIED:

          return "使用者拒絕提供定位權限";


        case error.POSITION_UNAVAILABLE:

          return "目前無法取得位置";


        case error.TIMEOUT:

          return "取得定位逾時";


        default:

          return "定位發生未知錯誤";

      }

    }


    // =====================================================
    // HTML 安全處理
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // 清除打卡結果
    //
    // 使用 visibility
    // 不會造成版面跳動
    // =====================================================

    function clearClockResult() {

      clockResult.innerHTML =
        "";

      clockResult.style.visibility =
        "hidden";

    }


    // =====================================================
    // 執行打卡
    //
    // 只有按下上班或下班打卡時才取得 GPS
    // =====================================================

    async function clock(
      type
    ) {


      // -----------------------------------------------------
      // 檢查 Apps Script URL
      // -----------------------------------------------------

      if (
        !APPS_SCRIPT_URL ||
        APPS_SCRIPT_URL.includes(
          "請把這裡換成"
        )
      ) {

        locationStatus.innerHTML = `

          <span class="error">

            ✕ 尚未設定 Google Apps Script 網址

          </span>

        `;


        locationStatus.className =
          "error";


        return;

      }


      // -----------------------------------------------------
      // 取得員工姓名
      // -----------------------------------------------------

      const name =
        employeeName.value.trim();


      if (!name) {

        locationStatus.innerHTML = `

          <span class="error">

            ✕ 請先輸入姓名

          </span>

        `;


        locationStatus.className =
          "error";


        employeeName.focus();


        return;

      }


      // -----------------------------------------------------
      // 防止連續點擊
      // -----------------------------------------------------

      setButtonsEnabled(
        false
      );


      // -----------------------------------------------------
      // 清除上一筆打卡結果
      // -----------------------------------------------------

      clearClockResult();


      // -----------------------------------------------------
      // 顯示定位中
      // -----------------------------------------------------

      locationStatus.innerHTML = `

        <span class="loading">

          正在取得打卡當下的位置...

        </span>

      `;


      locationStatus.className =
        "loading";


      // -----------------------------------------------------
      // 檢查瀏覽器是否支援 GPS
      // -----------------------------------------------------

      if (!navigator.geolocation) {

        locationStatus.innerHTML = `

          <span class="error">

            ✕ 此瀏覽器不支援 GPS 定位功能

          </span>

        `;


        locationStatus.className =
          "error";


        setButtonsEnabled(
          true
        );


        return;

      }


      // =====================================================
      // 取得打卡當下 GPS
      // =====================================================

      navigator.geolocation.getCurrentPosition(

        async function(position) {

          try {


            // -------------------------------------------------
            // 取得 GPS
            // -------------------------------------------------

            const latitude =
              position.coords.latitude;


            const longitude =
              position.coords.longitude;


            const accuracy =
              position.coords.accuracy;


            // -------------------------------------------------
            // 計算距離
            // -------------------------------------------------

            const distance =
              calculateDistance(

                latitude,

                longitude,

                COMPANY_LATITUDE,

                COMPANY_LONGITUDE

              );


            // -------------------------------------------------
            // GPS 誤差檢查
            // -------------------------------------------------

            if (
              accuracy >
              MAX_GPS_ACCURACY
            ) {

              locationStatus.innerHTML = `

                <span class="warning">

                  ⚠ GPS 定位誤差太大

                </span>

              `;


              locationStatus.className =
                "warning";


              setButtonsEnabled(
                true
              );


              return;

            }


            // -------------------------------------------------
            // 公司範圍檢查
            // -------------------------------------------------

            if (
              distance >
              ALLOWED_RADIUS
            ) {

              locationStatus.innerHTML = `

                <span class="error">

                  ✕ 不在公司打卡範圍內

                </span>

                <br>

                距離公司：約
                ${Math.round(
                  distance
                )}
                公尺

                <br>

                允許範圍：
                ${ALLOWED_RADIUS}
                公尺

              `;


              locationStatus.className =
                "error";


              setButtonsEnabled(
                true
              );


              return;

            }


            // -------------------------------------------------
            // GPS 通過
            // -------------------------------------------------

            locationStatus.innerHTML = `

              <span class="success">

                ✓ 定位確認成功

              </span>

              <br>

              <span class="loading">

                正在送出打卡資料...

              </span>

            `;


            locationStatus.className =
              "loading";


            // -------------------------------------------------
            // 建立傳送資料
            // -------------------------------------------------

            const data = {

              name:
                name,

              type:
                type,

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy

            };


            // -------------------------------------------------
            // 傳送到 Google Apps Script
            //
            // 這裡維持 text/plain
            // 避免觸發不必要的 CORS preflight
            // -------------------------------------------------

            const response =
              await fetch(

                APPS_SCRIPT_URL,

                {

                  method:
                    "POST",

                  headers: {

                    "Content-Type":
                      "text/plain;charset=utf-8"

                  },

                  body:
                    JSON.stringify(
                      data
                    )

                }

              );


            // =================================================
            // 重要修正
            //
            // 不直接：
            //
            // const result = await response.json();
            //
            // 而是先取得文字。
            //
            // 如果 Apps Script 回傳的 JSON 格式有一點不同，
            // 就不會直接進入 catch 被誤判成「無法連線」。
            // =================================================

            const responseText =
              await response.text();


            console.log(
              "Apps Script HTTP 狀態：",
              response.status
            );


            console.log(
              "Apps Script 回應：",
              responseText
            );


            // -------------------------------------------------
            // 嘗試解析 JSON
            // -------------------------------------------------

            let result = null;


            try {

              result =
                JSON.parse(
                  responseText
                );

            }

            catch (
              jsonError
            ) {

              console.error(
                "JSON 解析失敗：",
                jsonError
              );


              // -------------------------------------------------
              // Apps Script 有回應，但不是 JSON
              // -------------------------------------------------

              locationStatus.innerHTML = `

                <span class="warning">

                  ⚠ 伺服器已回應

                </span>

                <br>

                但回傳格式不是正確的 JSON

              `;


              locationStatus.className =
                "warning";


              setButtonsEnabled(
                true
              );


              return;

            }


            // -------------------------------------------------
            // Apps Script 回應不是物件
            // -------------------------------------------------

            if (
              !result ||
              typeof result !== "object"
            ) {

              locationStatus.innerHTML = `

                <span class="error">

                  ✕ 伺服器回應格式錯誤

                </span>

              `;


              locationStatus.className =
                "error";


              setButtonsEnabled(
                true
              );


              return;

            }


            // =================================================
            // 後端拒絕
            // =================================================

            if (
              result.success !== true
            ) {

              locationStatus.innerHTML = `

                <span class="error">

                  ✕
                  ${escapeHtml(
                    result.message ||
                    "打卡失敗"
                  )}

                </span>

              `;


              locationStatus.className =
                "error";


              setButtonsEnabled(
                true
              );


              return;

            }


            // =================================================
            // 打卡成功
            // =================================================

            clockResult.innerHTML = `

              <div class="result-title">

                ✓ ${escapeHtml(type)}成功

              </div>

            `;


            clockResult.style.visibility =
              "visible";


            // -------------------------------------------------
            // 清除定位狀態
            // -------------------------------------------------

            locationStatus.innerHTML =
              "";

            locationStatus.className =
              "";


            // -------------------------------------------------
            // 恢復按鈕
            // -------------------------------------------------

            setButtonsEnabled(
              true
            );


          }


          catch (error) {


            // =================================================
            // 真正的網路 / fetch / 其他錯誤
            // =================================================

            console.error(
              "打卡錯誤：",
              error
            );


            locationStatus.innerHTML = `

              <span class="error">

                ✕ 無法連線到打卡伺服器

              </span>

              <br>

              請確認網路連線以及
              Apps Script 網址是否正確。

            `;


            locationStatus.className =
              "error";


            setButtonsEnabled(
              true
            );

          }

        },


        // =====================================================
        // GPS 取得失敗
        // =====================================================

        function(error) {


          const message =
            getLocationErrorMessage(
              error
            );


          locationStatus.innerHTML = `

            <span class="error">

              ✕ ${message}

            </span>

          `;


          locationStatus.className =
            "error";


          setButtonsEnabled(
            true
          );

        },


        // =====================================================
        // GPS 設定
        // =====================================================

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0

        }

      );

    }


    // =====================================================
    // 上班打卡
    // =====================================================

    clockInButton.addEventListener(

      "click",

      function() {

        clock(
          "上班打卡"
        );

      }

    );


    // =====================================================
    // 下班打卡
    // =====================================================

    clockOutButton.addEventListener(

      "click",

      function() {

        clock(
          "下班打卡"
        );

      }

    );


    // =====================================================
    // 重要：
    //
    // 網頁開啟時不取得 GPS
    //
    // 只有按下打卡按鈕才取得 GPS
    // =====================================================


  </script>


</body>

</html>
