<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>萬達員工打卡系統</title>

  <style>

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      width: 90%;
      max-width: 450px;
      text-align: center;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      margin: 10px 0;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .buttons button {
      margin: 10px 5px;
      padding: 10px 20px;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .buttons button:hover {
      background-color: #0056b3;
    }

    .buttons button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    #locationStatus {
      margin: 15px 0;
      padding: 10px;
      border-radius: 5px;
      background-color: #f0f0f0;
      line-height: 1.6;
      word-break: break-word;
    }

    #record {
      margin-top: 15px;
      padding: 10px;
      text-align: left;
      background: #f8f8f8;
      border-radius: 5px;
      line-height: 1.7;
      word-break: break-word;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .warning {
      color: #d97706;
    }

    .loading {
      color: #555;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>萬達員工打卡系統</h1>

    <input
      type="text"
      id="employeeName"
      placeholder="請輸入姓名"
      autocomplete="name"
    >

    <p id="date"></p>

    <p id="time"></p>

    <div id="locationStatus">
      正在取得定位...
    </div>

    <div class="buttons">

      <button
        id="clockIn"
        disabled
      >
        上班打卡
      </button>

      <button
        id="clockOut"
        disabled
      >
        下班打卡
      </button>

    </div>

    <h2>今日紀錄</h2>

    <div id="record">
      尚無打卡紀錄
    </div>

  </div>


  <script>

    // =====================================================
    // Google Apps Script 網址
    // =====================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx3P1xFiJAGXUVI6wvvmYcaBOoInWRB4qnmklP1r3XVRmkZzY9-wY4AOBPEGqLPfFE/exec";


    // =====================================================
    // 公司位置
    // =====================================================

    const COMPANY_LATITUDE =
      22.721929694216037;

    const COMPANY_LONGITUDE =
      120.30024030275378;


    // =====================================================
    // 公司允許打卡範圍
    // =====================================================

    const ALLOWED_RADIUS = 100;


    // =====================================================
    // 目前 GPS 位置
    // =====================================================

    let currentLocation = null;


    // =====================================================
    // DOM
    // =====================================================

    const employeeName =
      document.getElementById("employeeName");

    const dateElement =
      document.getElementById("date");

    const timeElement =
      document.getElementById("time");

    const locationStatus =
      document.getElementById("locationStatus");

    const clockInButton =
      document.getElementById("clockIn");

    const clockOutButton =
      document.getElementById("clockOut");

    const recordElement =
      document.getElementById("record");


    // =====================================================
    // 顯示日期與時間
    // =====================================================

    function updateDateTime() {

      const now = new Date();

      dateElement.textContent =
        "日期：" +
        now.toLocaleDateString("zh-TW");

      timeElement.textContent =
        "時間：" +
        now.toLocaleTimeString(
          "zh-TW",
          {
            hour12: false
          }
        );

    }


    updateDateTime();

    setInterval(
      updateDateTime,
      1000
    );


    // =====================================================
    // Haversine Formula
    // =====================================================

    function calculateDistance(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const earthRadius = 6371000;

      const lat1Rad =
        lat1 * Math.PI / 180;

      const lat2Rad =
        lat2 * Math.PI / 180;

      const deltaLat =
        (lat2 - lat1) *
        Math.PI / 180;

      const deltaLon =
        (lon2 - lon1) *
        Math.PI / 180;

      const a =
        Math.sin(deltaLat / 2) *
        Math.sin(deltaLat / 2) +

        Math.cos(lat1Rad) *
        Math.cos(lat2Rad) *

        Math.sin(deltaLon / 2) *
        Math.sin(deltaLon / 2);

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return earthRadius * c;

    }


    // =====================================================
    // 設定按鈕
    // =====================================================

    function setButtonsEnabled(enabled) {

      clockInButton.disabled =
        !enabled;

      clockOutButton.disabled =
        !enabled;

    }


    // =====================================================
    // 取得 GPS
    // =====================================================

    function getLocation() {

      setButtonsEnabled(false);

      currentLocation = null;


      if (!navigator.geolocation) {

        locationStatus.textContent =
          "✕ 此瀏覽器不支援 GPS 定位功能";

        locationStatus.className =
          "error";

        return;

      }


      locationStatus.textContent =
        "正在取得目前位置...";

      locationStatus.className =
        "loading";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          currentLocation = {

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              accuracy

          };


          const distance =
            calculateDistance(

              latitude,
              longitude,

              COMPANY_LATITUDE,
              COMPANY_LONGITUDE

            );


          if (
            distance <=
            ALLOWED_RADIUS
          ) {

            locationStatus.innerHTML = `

              <span class="success">
                ✓ 定位成功，可打卡
              </span>

              <br>

              距離公司：約
              ${Math.round(distance)}
              公尺

              <br>

              緯度：
              ${latitude.toFixed(6)}

              <br>

              經度：
              ${longitude.toFixed(6)}

            `;

            locationStatus.className =
              "success";

            setButtonsEnabled(true);

          } else {

            locationStatus.innerHTML = `

              <span class="error">
                ✕ 不在公司打卡範圍內
              </span>

              <br>

              距離公司：約
              ${Math.round(distance)}
              公尺

              <br>

              允許範圍：
              ${ALLOWED_RADIUS}
              公尺

              <br>

              定位誤差：約
              ${Math.round(accuracy)}
              公尺

            `;

            locationStatus.className =
              "error";

            setButtonsEnabled(false);

          }

        },


        function(error) {

          currentLocation = null;

          setButtonsEnabled(false);

          let message = "";

          switch (error.code) {

            case error.PERMISSION_DENIED:

              message =
                "使用者拒絕提供定位權限";

              break;

            case error.POSITION_UNAVAILABLE:

              message =
                "目前無法取得位置";

              break;

            case error.TIMEOUT:

              message =
                "取得定位逾時";

              break;

            default:

              message =
                "定位發生未知錯誤";

          }

          locationStatus.textContent =
            "✕ " + message;

          locationStatus.className =
            "error";

        },


        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }


    // =====================================================
    // 重新取得 GPS
    // =====================================================

    function refreshLocation() {

      getLocation();

    }


    // =====================================================
    // 打卡
    // =====================================================

    async function clock(type) {

      // ---------------------------------------------------
      // 檢查網址
      // ---------------------------------------------------

      if (!APPS_SCRIPT_URL) {

        alert(
          "尚未設定 Google Apps Script 網址"
        );

        return;

      }


      // ---------------------------------------------------
      // 取得姓名
      // ---------------------------------------------------

      const name =
        employeeName.value.trim();


      if (!name) {

        alert(
          "請先輸入姓名"
        );

        employeeName.focus();

        return;

      }


      // ---------------------------------------------------
      // 檢查 GPS
      // ---------------------------------------------------

      if (!currentLocation) {

        alert(
          "尚未取得定位，請先允許瀏覽器使用定位功能"
        );

        refreshLocation();

        return;

      }


      // ---------------------------------------------------
      // 暫時停用按鈕
      // ---------------------------------------------------

      setButtonsEnabled(false);

      locationStatus.textContent =
        "正在送出打卡資料...";

      locationStatus.className =
        "loading";


      // ---------------------------------------------------
      // GPS
      // ---------------------------------------------------

      const latitude =
        currentLocation.latitude;

      const longitude =
        currentLocation.longitude;

      const accuracy =
        currentLocation.accuracy;


      // ---------------------------------------------------
      // 要傳送給 Apps Script 的資料
      // ---------------------------------------------------

      const data = {

        name:
          name,

        type:
          type,

        latitude:
          latitude,

        longitude:
          longitude,

        accuracy:
          accuracy,

        clientDate:
          new Date().toLocaleDateString("zh-TW"),

        clientTime:
          new Date().toLocaleTimeString(
            "zh-TW",
            {
              hour12: false
            }
          )

      };


      try {

        // -------------------------------------------------
        // 傳送資料
        //
        // 注意：
        // 使用 text/plain 可以避免部分瀏覽器
        // CORS 預檢問題
        // -------------------------------------------------

        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "text/plain;charset=utf-8"
                },

              body:
                JSON.stringify(data)

            }

          );


        // -------------------------------------------------
        // 檢查 HTTP 狀態
        // -------------------------------------------------

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        // -------------------------------------------------
        // 取得文字
        // -------------------------------------------------

        const responseText =
          await response.text();


        console.log(
          "Apps Script 回應：",
          responseText
        );


        // -------------------------------------------------
        // 解析 JSON
        // -------------------------------------------------

        let result;

        try {

          result =
            JSON.parse(responseText);

        } catch (jsonError) {

          console.error(
            "Apps Script 回應不是 JSON：",
            responseText
          );

          throw new Error(
            "伺服器回應格式錯誤"
          );

        }


        // -------------------------------------------------
        // 後端拒絕
        // -------------------------------------------------

        if (!result.success) {

          alert(
            result.message ||
            "打卡失敗"
          );


          recordElement.innerHTML = `

            <span class="error">

              ${escapeHtml(
                result.message ||
                "打卡失敗"
              )}

            </span>

          `;

          recordElement.className =
            "error";


          refreshLocation();

          return;

        }


        // =================================================
        // 打卡成功
        // =================================================

        recordElement.innerHTML = `

          <strong>
            ${escapeHtml(
              result.type || type
            )}
          </strong>

          <br>

          員工：
          ${escapeHtml(
            result.name || name
          )}

          <br>

          日期：
          ${escapeHtml(
            result.date || ""
          )}

          <br>

          時間：
          ${escapeHtml(
            result.time || ""
          )}

          <br>

          距離公司：
          約
          ${Math.round(
            Number(result.distance || 0)
          )}
          公尺

          <br>


        `;


        recordElement.className =
          "success";


        alert(

          (result.message ||
            type + "成功") +

          "\n\n" +

          "員工：" +
          (result.name || name) +

          "\n" +

          "日期：" +
          (result.date || "") +

          "\n" +

          "時間：" +
          (result.time || "") +

          "\n" +

          "距離公司：約 " +
          Math.round(
            Number(result.distance || 0)
          ) +
          " 公尺"

        );


        // -------------------------------------------------
        // 成功後重新取得 GPS
        // -------------------------------------------------

        refreshLocation();


      } catch (error) {

        console.error(
          "打卡錯誤：",
          error
        );


        alert(

          "無法連線到打卡伺服器。\n\n" +

          "錯誤：" +
          error.message +

          "\n\n" +

          "請確認 Apps Script 部署網址是否正確。"

        );


        recordElement.innerHTML = `

          <span class="error">

            無法連線到打卡伺服器

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </span>

        `;


        recordElement.className =
          "error";


        refreshLocation();

      }

    }


    // =====================================================
    // 防止 HTML Injection
    // =====================================================

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // 上班打卡
    // =====================================================

    clockInButton.addEventListener(
      "click",
      function() {

        clock("上班打卡");

      }
    );


    // =====================================================
    // 下班打卡
    // =====================================================

    clockOutButton.addEventListener(
      "click",
      function() {

        clock("下班打卡");

      }
    );


    // =====================================================
    // 網頁載入時取得 GPS
    // =====================================================

    getLocation();

  </script>

</body>

</html>
