<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>萬達員工打卡系統</title>


  <style>

    body {

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      margin: 0;

      font-family: Arial, sans-serif;

      background-color: #f5f5f5;

    }


    .container {

      width: 90%;

      max-width: 450px;

      text-align: center;

      background: #fff;

      padding: 30px;

      border-radius: 10px;

      box-shadow:
        0 0 10px rgba(0, 0, 0, 0.1);

    }


    input {

      padding: 10px;

      margin: 10px 0;

      width: 80%;

      border: 1px solid #ccc;

      border-radius: 5px;

      box-sizing: border-box;

      font-size: 16px;

    }


    .buttons button {

      margin: 10px 5px;

      padding: 10px 20px;

      border: none;

      background-color: #007bff;

      color: white;

      border-radius: 5px;

      cursor: pointer;

      font-size: 16px;

    }


    .buttons button:hover {

      background-color: #0056b3;

    }


    .buttons button:disabled {

      background-color: #999;

      cursor: not-allowed;

    }


    #locationStatus {

      margin: 15px 0;

      padding: 10px;

      border-radius: 5px;

      background-color: #f0f0f0;

      line-height: 1.6;

      word-break: break-word;

    }


    #record {

      margin-top: 15px;

      padding: 10px;

      text-align: left;

      background: #f8f8f8;

      border-radius: 5px;

      line-height: 1.7;

      word-break: break-word;

    }


    .success {

      color: green;

    }


    .error {

      color: red;

    }


    .warning {

      color: #d97706;

    }


    .loading {

      color: #555;

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>萬達員工打卡系統</h1>


    <!-- 員工姓名 -->

    <input
      type="text"
      id="employeeName"
      placeholder="請輸入姓名"
      autocomplete="name"
    >


    <!-- 日期 -->

    <p id="date"></p>


    <!-- 時間 -->

    <p id="time"></p>


    <!-- GPS 狀態 -->

    <div id="locationStatus">

      正在取得定位...

    </div>


    <!-- 打卡按鈕 -->

    <div class="buttons">

      <button
        id="clockIn"
        disabled
      >
        上班打卡
      </button>


      <button
        id="clockOut"
        disabled
      >
        下班打卡
      </button>

    </div>


    <h2>今日紀錄</h2>


    <div id="record">

      尚無打卡紀錄

    </div>


  </div>


  <script>


    // =====================================================
    // Google Apps Script 網址
    // =====================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzlld1b7AOtky-DegF9HYa9cdbMTimLHqNgcNIxaqPz3sOdxCXK6DbnnL9QG7C9OEI/exec";


    // =====================================================
    // 公司位置
    // =====================================================

    const COMPANY_LATITUDE =
      22.721785308817168;


    const COMPANY_LONGITUDE =
      120.30031616249235;


    // =====================================================
    // 公司允許打卡範圍
    // =====================================================

    const ALLOWED_RADIUS =
      70;


    // =====================================================
    // GPS 最大允許誤差
    //
    // 如果手機回報 accuracy > 70 公尺
    // 就拒絕打卡
    // =====================================================

    const MAX_GPS_ACCURACY =
      70;


    // =====================================================
    // 目前 GPS 位置
    //
    // 這個變數只用來顯示目前位置
    //
    // 真正打卡時一定會重新取得 GPS
    // =====================================================

    let currentLocation =
      null;


    // =====================================================
    // DOM
    // =====================================================

    const employeeName =
      document.getElementById(
        "employeeName"
      );


    const dateElement =
      document.getElementById(
        "date"
      );


    const timeElement =
      document.getElementById(
        "time"
      );


    const locationStatus =
      document.getElementById(
        "locationStatus"
      );


    const clockInButton =
      document.getElementById(
        "clockIn"
      );


    const clockOutButton =
      document.getElementById(
        "clockOut"
      );


    const recordElement =
      document.getElementById(
        "record"
      );


    // =====================================================
    // 日期與時間
    // =====================================================

    function updateDateTime() {

      const now =
        new Date();


      dateElement.textContent =
        "日期：" +
        now.toLocaleDateString(
          "zh-TW"
        );


      timeElement.textContent =
        "時間：" +
        now.toLocaleTimeString(
          "zh-TW",
          {
            hour12: false
          }
        );

    }


    updateDateTime();


    setInterval(
      updateDateTime,
      1000
    );


    // =====================================================
    // Haversine Formula
    // 計算兩個 GPS 座標之間的距離
    // =====================================================

    function calculateDistance(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const earthRadius =
        6371000;


      const lat1Rad =
        lat1 *
        Math.PI /
        180;


      const lat2Rad =
        lat2 *
        Math.PI /
        180;


      const deltaLat =
        (lat2 - lat1) *
        Math.PI /
        180;


      const deltaLon =
        (lon2 - lon1) *
        Math.PI /
        180;


      const a =

        Math.sin(
          deltaLat / 2
        ) ** 2 +

        Math.cos(lat1Rad) *

        Math.cos(lat2Rad) *

        Math.sin(
          deltaLon / 2
        ) ** 2;


      const c =

        2 *

        Math.atan2(

          Math.sqrt(a),

          Math.sqrt(1 - a)

        );


      return (
        earthRadius *
        c
      );

    }


    // =====================================================
    // 設定按鈕
    // =====================================================

    function setButtonsEnabled(
      enabled
    ) {

      clockInButton.disabled =
        !enabled;


      clockOutButton.disabled =
        !enabled;

    }


    // =====================================================
    // 顯示 GPS 狀態
    // =====================================================

    function showLocation(
      latitude,
      longitude,
      accuracy,
      distance
    ) {

      locationStatus.innerHTML = `

        <span class="success">

          ✓ 定位成功，可打卡

        </span>

        <br>

        距離公司：約
        ${Math.round(distance)}
        公尺

        <br>

        定位誤差：約
        ${Math.round(accuracy)}
        公尺

        <br>

        緯度：
        ${latitude.toFixed(6)}

        <br>

        經度：
        ${longitude.toFixed(6)}

      `;


      locationStatus.className =
        "success";

    }


    // =====================================================
    // 取得 GPS
    // =====================================================

    function getLocation() {


      setButtonsEnabled(false);


      currentLocation =
        null;


      if (!navigator.geolocation) {

        locationStatus.textContent =
          "✕ 此瀏覽器不支援 GPS 定位功能";


        locationStatus.className =
          "error";


        return;

      }


      locationStatus.textContent =
        "正在取得目前位置...";


      locationStatus.className =
        "loading";


      navigator.geolocation.getCurrentPosition(

        function(position) {


          const latitude =
            position.coords.latitude;


          const longitude =
            position.coords.longitude;


          const accuracy =
            position.coords.accuracy;


          // -------------------------------------------------
          // 計算距離
          // -------------------------------------------------

          const distance =
            calculateDistance(

              latitude,

              longitude,

              COMPANY_LATITUDE,

              COMPANY_LONGITUDE

            );


          // -------------------------------------------------
          // 儲存目前位置
          //
          // 注意：
          // 打卡時仍然會重新取得 GPS
          // -------------------------------------------------

          currentLocation = {

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              accuracy,

            distance:
              distance

          };


          // -------------------------------------------------
          // GPS 誤差太大
          // -------------------------------------------------

          if (
            accuracy >
            MAX_GPS_ACCURACY
          ) {

            locationStatus.innerHTML = `

              <span class="warning">

                ⚠ GPS 定位誤差太大

              </span>

            `;


            locationStatus.className =
              "warning";


            setButtonsEnabled(false);


            return;

          }


          // -------------------------------------------------
          // 不在公司範圍
          // -------------------------------------------------

          if (
            distance >
            ALLOWED_RADIUS
          ) {

            locationStatus.innerHTML = `

              <span class="error">

                ✕ 不在公司打卡範圍內

              </span>

              <br>

              距離公司：約
              ${Math.round(distance)}
              公尺

              <br>

              允許範圍：
              ${ALLOWED_RADIUS}
              公尺

              <br>

              定位誤差：約
              ${Math.round(accuracy)}
              公尺

            `;


            locationStatus.className =
              "error";


            setButtonsEnabled(false);


            return;

          }


          // -------------------------------------------------
          // 定位成功
          // -------------------------------------------------

          showLocation(

            latitude,

            longitude,

            accuracy,

            distance

          );


          setButtonsEnabled(true);

        },


        function(error) {


          currentLocation =
            null;


          setButtonsEnabled(false);


          let message =
            "";


          switch (
            error.code
          ) {


            case error.PERMISSION_DENIED:

              message =
                "使用者拒絕提供定位權限";

              break;


            case error.POSITION_UNAVAILABLE:

              message =
                "目前無法取得位置";

              break;


            case error.TIMEOUT:

              message =
                "取得定位逾時";

              break;


            default:

              message =
                "定位發生未知錯誤";

          }


          locationStatus.textContent =
            "✕ " + message;


          locationStatus.className =
            "error";

        },


        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0

        }

      );

    }


    // =====================================================
    // 重新取得 GPS
    // =====================================================

    function refreshLocation() {

      getLocation();

    }


    // =====================================================
    // 真正的打卡函式
    //
    // 最重要的安全修改：
    //
    // 每一次按打卡都重新取得 GPS
    //
    // 不使用舊的 currentLocation
    // =====================================================

    async function clock(
      type
    ) {


      // -----------------------------------------------------
      // 檢查 Apps Script
      // -----------------------------------------------------

      if (
        !APPS_SCRIPT_URL ||
        APPS_SCRIPT_URL.includes(
          "請把這裡換成"
        )
      ) {

        alert(
          "尚未設定 Google Apps Script 網址"
        );

        return;

      }


      // -----------------------------------------------------
      // 取得姓名
      // -----------------------------------------------------

      const name =
        employeeName.value.trim();


      if (!name) {

        alert(
          "請先輸入姓名"
        );


        employeeName.focus();


        return;

      }


      // -----------------------------------------------------
      // 禁止重複按按鈕
      // -----------------------------------------------------

      setButtonsEnabled(
        false
      );


      locationStatus.textContent =
        "正在取得打卡當下的位置...";


      locationStatus.className =
        "loading";


      // -----------------------------------------------------
      // 瀏覽器 GPS 支援
      // -----------------------------------------------------

      if (!navigator.geolocation) {

        alert(
          "此瀏覽器不支援 GPS 定位功能"
        );


        return;

      }


      // =====================================================
      // 每次打卡重新取得 GPS
      // =====================================================

      navigator.geolocation.getCurrentPosition(

        async function(position) {

          try {


            // -------------------------------------------------
            // 取得最新 GPS
            // -------------------------------------------------

            const latitude =
              position.coords.latitude;


            const longitude =
              position.coords.longitude;


            const accuracy =
              position.coords.accuracy;


            // -------------------------------------------------
            // 重新計算距離
            // -------------------------------------------------

            const distance =
              calculateDistance(

                latitude,

                longitude,

                COMPANY_LATITUDE,

                COMPANY_LONGITUDE

              );


            // -------------------------------------------------
            // GPS 誤差檢查
            // -------------------------------------------------

            if (
              accuracy >
              MAX_GPS_ACCURACY
            ) {

              locationStatus.innerHTML = `

                <span class="warning">

                  ⚠ GPS 定位誤差太大

                </span>

                <br>

                定位誤差：約
                ${Math.round(accuracy)}
                公尺

                <br>

                最大允許誤差：
                ${MAX_GPS_ACCURACY}
                公尺

              `;


              locationStatus.className =
                "warning";


              alert(

                "GPS 定位誤差太大。\n\n" +

                "目前誤差約 " +

                Math.round(accuracy) +

                " 公尺。\n\n" +

                "請稍候再試。"

              );


              return;

            }


            // -------------------------------------------------
            // 公司範圍檢查
            // -------------------------------------------------

            if (
              distance >
              ALLOWED_RADIUS
            ) {

              locationStatus.innerHTML = `

                <span class="error">

                  ✕ 不在公司打卡範圍內

                </span>

                <br>

                距離公司：約
                ${Math.round(distance)}
                公尺

                <br>

                允許範圍：
                ${ALLOWED_RADIUS}
                公尺

                <br>

                定位誤差：約
                ${Math.round(accuracy)}
                公尺

              `;


              locationStatus.className =
                "error";


              alert(

                "目前不在公司打卡範圍內。\n\n" +

                "距離公司約 " +

                Math.round(distance) +

                " 公尺。"

              );


              return;

            }


            // -------------------------------------------------
            // 顯示送出狀態
            // -------------------------------------------------

            locationStatus.innerHTML = `

              <span class="loading">

                正在送出打卡資料...

              </span>

              <br>

              距離公司：約
              ${Math.round(distance)}
              公尺

              <br>

              定位誤差：約
              ${Math.round(accuracy)}
              公尺

            `;


            // -------------------------------------------------
            // 建立資料
            // -------------------------------------------------

            const data = {

              name:
                name,

              type:
                type,

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              clientDate:
                new Date()
                  .toLocaleDateString(
                    "zh-TW"
                  ),

              clientTime:
                new Date()
                  .toLocaleTimeString(
                    "zh-TW",
                    {
                      hour12: false
                    }
                  )

            };


            // -------------------------------------------------
            // 傳送給 Apps Script
            // -------------------------------------------------

            const response =
              await fetch(

                APPS_SCRIPT_URL,

                {

                  method:
                    "POST",

                  headers: {

                    "Content-Type":
                      "text/plain;charset=utf-8"

                  },

                  body:
                    JSON.stringify(data)

                }

              );


            // -------------------------------------------------
            // 解析後端結果
            // -------------------------------------------------

            const result =
              await response.json();


            // -------------------------------------------------
            // 後端拒絕
            // -------------------------------------------------

            if (
              !result.success
            ) {

              alert(

                result.message ||
                "打卡失敗"

              );


              recordElement.innerHTML = `

                <span class="error">

                  ${escapeHtml(
                    result.message ||
                    "打卡失敗"
                  )}

                </span>

              `;


              recordElement.className =
                "error";


              return;

            }


            // -------------------------------------------------
            // 打卡成功
            // -------------------------------------------------

            recordElement.innerHTML = `

              <strong>

                ${escapeHtml(
                  result.type ||
                  type
                )}

              </strong>

              <br>

              員工：

              ${escapeHtml(
                result.name ||
                name
              )}

              <br>

              日期：

              ${escapeHtml(
                result.date ||
                ""
              )}

              <br>

              時間：

              ${escapeHtml(
                result.time ||
                ""
              )}

              <br>

              緯度：

              ${Number(
                latitude
              ).toFixed(6)}

              <br>

              經度：

              ${Number(
                longitude
              ).toFixed(6)}

              <br>

              距離公司：

              約
              ${Math.round(
                Number(
                  result.distance ||
                  distance
                )
              )}
              公尺

              <br>

              定位誤差：

              約
              ${Math.round(
                Number(
                  accuracy
                )
              )}
              公尺

            `;


            recordElement.className =
              "success";


            // -------------------------------------------------
            // 成功提示
            // -------------------------------------------------

            alert(

              (
                result.message ||
                type + "成功"
              ) +

              "\n\n" +

              "員工：" +

              (
                result.name ||
                name
              ) +

              "\n" +

              "時間：" +

              (
                result.time ||
                ""
              ) +

              "\n" +

              "距離公司：約 " +

              Math.round(

                Number(
                  result.distance ||
                  distance
                )

              ) +

              " 公尺"

            );


          } catch (error) {


            // -------------------------------------------------
            // 網路 / API 錯誤
            // -------------------------------------------------

            console.error(
              "打卡錯誤：",
              error
            );


            alert(

              "無法連線到打卡伺服器。\n\n" +

              "請確認網路連線以及 " +

              "Apps Script 網址是否正確。"

            );


            recordElement.innerHTML = `

              <span class="error">

                無法連線到打卡伺服器

              </span>

            `;


            recordElement.className =
              "error";

          }


          // -------------------------------------------------
          // 打卡完成後重新定位
          // -------------------------------------------------

          getLocation();

        },


        // =====================================================
        // GPS 取得失敗
        // =====================================================

        function(error) {


          setButtonsEnabled(
            false
          );


          currentLocation =
            null;


          let message =
            "";


          switch (
            error.code
          ) {


            case error.PERMISSION_DENIED:

              message =
                "使用者拒絕提供定位權限";

              break;


            case error.POSITION_UNAVAILABLE:

              message =
                "目前無法取得位置";

              break;


            case error.TIMEOUT:

              message =
                "取得定位逾時";

              break;


            default:

              message =
                "定位發生未知錯誤";

          }


          locationStatus.textContent =
            "✕ " + message;


          locationStatus.className =
            "error";


          alert(
            message
          );

        },


        {

          // -------------------------------------------------
          // 優先使用高精度 GPS
          // -------------------------------------------------

          enableHighAccuracy:
            true,

          // -------------------------------------------------
          // 最多等待 15 秒
          // -------------------------------------------------

          timeout:
            15000,

          // -------------------------------------------------
          // 不使用瀏覽器快取的舊位置
          // -------------------------------------------------

          maximumAge:
            0

        }

      );

    }


    // =====================================================
    // HTML 安全處理
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // 上班打卡
    // =====================================================

    clockInButton.addEventListener(

      "click",

      function() {

        clock(
          "上班打卡"
        );

      }

    );


    // =====================================================
    // 下班打卡
    // =====================================================

    clockOutButton.addEventListener(

      "click",

      function() {

        clock(
          "下班打卡"
        );

      }

    );


    // =====================================================
    // 網頁載入時取得 GPS
    // =====================================================

    getLocation();

  </script>


</body>

</html>
